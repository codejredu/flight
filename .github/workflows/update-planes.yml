name: Update ADSB Data

on:
  schedule:
    - cron: '*/5 * * * *' # רץ אוטומטית כל 5 דקות
  workflow_dispatch:      # מאפשר הפעלה ידנית מתוך לשונית Actions ב-GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run fetch script
        run: python fetch_planes.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add public/planes.json planes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update planes data [skip ci]" && git push)
